site_name: !ENV [SITE_NAME, "Manual de Operación — Brown Caffeine Lab"]
site_url: !ENV [SITE_URL, ""]
site_description: Manual oficial de operación, políticas y estándares.
docs_dir: docs
use_directory_urls: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/brand.css

theme:
  name: material
  language: es
  icon:
    logo: material/coffee
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow

plugins:
  - search:
      lang: es
  - macros:
      module_name: main
      on_error_fail: true

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - Introducción: introduccion.md
  - Capítulo I — Cultura Organizacional:
      - "1.1 Marca y Experiencia del Cliente": cap1-marca.md
      - "1.2 Convivencia y Hospitalidad": cap1-convivencia.md
      - "1.3 No Discriminación e Igualdad": cap1-no-discriminacion.md
  - Capítulo II — Conducta y Relaciones Laborales:
      - "2.1 Conducta, Operación y Disciplina": cap2-conducta.md
      - "2.2 Clasificación de Faltas": cap2-faltas.md
      - "2.3 Investigación Interna": cap2-investigacion.md
      - "2.4 Quejas y Reportes Internos": cap2-quejas.md
      - "2.5 Hostigamiento, Acoso y Discriminación": cap2-hostigamiento.md
  - Capítulo III — Seguridad y Gestión de Riesgos:
      - "3.1 Seguridad e Higiene": cap3-seguridad-higiene.md
      - "3.2 Plan de Emergencias": cap3-emergencias.md
      - "3.3 Videovigilancia (CCTV)": cap3-videovigilancia.md
  - Capítulo IV — Calidad Operativa:
      - "4.1 Calidad del Café": cap4-calidad-cafe.md
      - "4.2 Inventarios y Mermas": cap4-inventarios.md
      - "4.3 Caja y Efectivo": cap4-caja.md
      - "4.4 Consumo de Alimentos y Bebidas": cap4-consumo.md
      - "4.5 Redes Sociales e Imagen": cap4-redes.md
  - Capítulo V — Desarrollo Profesional:
      - "5.1 KPIs por Barista": cap5-kpis.md
  - Anexos Técnicos:
      - "Anexo A — Consumo para Capacitación": anexo-a.md
      - "Anexo B — Mermas Aceptables": anexo-b.md
      - "Anexo C — Seguridad Alimentaria": anexo-c.md
      - "Anexo D — Conservación y Vida Útil": anexo-d.md
      - "Anexo E — Creación de Contenido": anexo-e.md
  - Formatos y Plantillas: formatos.md
