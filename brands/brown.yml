# Configuración de marca — Brown
name: "Brown Caffeine Lab"     # nombre completo/legal
short: "Brown"                  # nombre corto/informal
code: "MO-BCL-001"             # código del documento

# Identidad real (ver MANUAL DE MARCA BROWN): retro-ochentero + café como
# laboratorio. Negro + crema con acentos CPK (rojo/oxígeno, azul/nitrógeno).
# El rojo canónico de marca es #D24242; se aplica #C0392B (mismo rojo, un
# punto más profundo) para cumplir contraste AA sobre el fondo crema.
accent: "#C0392B"              # rojo terracota (oxígeno) — links, valores, títulos de capítulo
accent_light: "#F08A8A"        # variante clara para modo oscuro y hovers
chrome: "#1E1E1E"              # Eerie Black — barra superior y navegación
bg: "#FBF6EC"                  # crema suave — fondo de página (modo claro)
